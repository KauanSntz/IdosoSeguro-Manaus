<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="24" fill="#F8FBFA"/>

  <!-- WhatsApp Chat Bubble -->
  <g transform="translate(120, 80)">
    <rect width="360" height="240" rx="20" fill="#25D366" opacity="0.15"/>
    <rect width="340" height="220" x="10" y="10" rx="16" fill="#FFFFFF" stroke="#25D366" stroke-width="4"/>
    
    <!-- Header avatar -->
    <circle cx="50" cy="50" r="22" fill="#E6F2FF"/>
    <text x="50" y="56" font-size="20" text-anchor="middle">👤</text>
    <text x="85" y="48" font-size="16" font-weight="bold" fill="#17324D">Novo Número (Falso Parente)</text>
    <text x="85" y="66" font-size="12" fill="#506579">online agora</text>

    <!-- Chat bubble inside -->
    <rect x="30" y="90" width="280" height="90" rx="12" fill="#DCF8C6"/>
    <text x="45" y="115" font-size="14" font-weight="bold" fill="#17324D">"Mãe, troquei de número!</text>
    <text x="45" y="135" font-size="14" fill="#17324D">Tive um imprevisto e preciso</text>
    <text x="45" y="155" font-size="14" fill="#17324D">fazer um Pix urgente de R$ 800."</text>

    <!-- Warning Overlay Badge -->
    <circle cx="310" cy="180" r="28" fill="#F4B740" stroke="#FFFFFF" stroke-width="4"/>
    <text x="310" y="188" font-size="26" text-anchor="middle">⚠️</text>
  </g>
</svg>
