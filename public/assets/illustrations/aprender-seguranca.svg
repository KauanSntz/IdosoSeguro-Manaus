<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="24" fill="#F8FBFA"/>
  <circle cx="300" cy="200" r="160" fill="#E6F2FF"/>
  
  <!-- Open Book -->
  <g transform="translate(180, 140)">
    <path d="M 20 20 Q 120 0 120 40 L 120 160 Q 120 120 20 130 Z" fill="#FFFFFF" stroke="#1D5D9B" stroke-width="4"/>
    <path d="M 220 20 Q 120 0 120 40 L 120 160 Q 120 120 220 130 Z" fill="#FFFFFF" stroke="#1D5D9B" stroke-width="4"/>
    <!-- Book Spine -->
    <line x1="120" y1="40" x2="120" y2="160" stroke="#1D5D9B" stroke-width="6"/>

    <!-- Text lines inside book -->
    <line x1="40" y1="60" x2="100" y2="60" stroke="#506579" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="85" x2="90" y2="85" stroke="#506579" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="110" x2="95" y2="110" stroke="#506579" stroke-width="4" stroke-linecap="round"/>

    <!-- Shield on right page -->
    <path d="M 170 60 C 190 60 200 65 200 80 C 200 100 175 115 170 120 C 165 115 140 100 140 80 C 140 65 150 60 170 60 Z" fill="#138A5B"/>
    <path d="M 163 80 L 168 85 L 178 75" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Star Icons -->
  <text x="120" y="100" font-size="32">✨</text>
  <text x="450" y="110" font-size="32">🎓</text>
  <text x="460" y="300" font-size="32">🛡️</text>
</svg>
