<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="24" fill="#F8FBFA"/>
  <circle cx="300" cy="200" r="140" fill="#DDF5E9"/>

  <!-- Padlock -->
  <g transform="translate(220, 100)">
    <!-- Shackle -->
    <path d="M 40 100 L 40 60 C 40 20 120 20 120 60 L 120 100" fill="none" stroke="#138A5B" stroke-width="20" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="10" y="90" width="140" height="130" rx="20" fill="#138A5B"/>
    <!-- Keyhole -->
    <circle cx="80" cy="145" r="14" fill="#FFFFFF"/>
    <polygon points="73,150 87,150 84,180 76,180" fill="#FFFFFF"/>
  </g>

  <text x="120" y="140" font-size="40">🔐</text>
  <text x="440" y="260" font-size="40">🛡️</text>
</svg>
