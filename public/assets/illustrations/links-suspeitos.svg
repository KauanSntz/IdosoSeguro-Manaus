<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="24" fill="#F8FBFA"/>
  
  <!-- Browser Window -->
  <g transform="translate(100, 70)">
    <rect width="400" height="260" rx="16" fill="#FFFFFF" stroke="#1D5D9B" stroke-width="4"/>
    <path d="M 0 16 C 0 7 7 0 16 0 L 384 0 C 393 0 400 7 400 16 L 400 45 L 0 45 Z" fill="#E6F2FF"/>
    
    <!-- Dots -->
    <circle cx="25" cy="22" r="6" fill="#D94A4A"/>
    <circle cx="45" cy="22" r="6" fill="#F4B740"/>
    <circle cx="65" cy="22" r="6" fill="#138A5B"/>

    <!-- URL bar -->
    <rect x="90" y="10" width="280" height="26" rx="13" fill="#FFFFFF"/>
    <text x="105" y="28" font-size="14" fill="#D94A4A" font-family="sans-serif" font-weight="bold">⚠️ http://site-suspeito-recadastro.site</text>

    <!-- Browser Body Content -->
    <rect x="40" y="80" width="320" height="20" rx="4" fill="#FCE0D1"/>
    <rect x="40" y="120" width="240" height="15" rx="4" fill="#E6F2FF"/>
    <rect x="40" y="150" width="280" height="15" rx="4" fill="#E6F2FF"/>
    <rect x="40" y="180" width="180" height="15" rx="4" fill="#E6F2FF"/>

    <!-- Warning Icon -->
    <g transform="translate(300, 160)">
      <polygon points="30,0 60,50 0,50" fill="#F4B740"/>
      <text x="30" y="42" font-size="28" font-weight="bold" fill="#17324D" text-anchor="middle">!</text>
    </g>
  </g>
</svg>
