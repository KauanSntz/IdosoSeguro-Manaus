<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="24" fill="#F8FBFA"/>
  <circle cx="300" cy="200" r="150" fill="#DDF5E9"/>
  
  <!-- Message Bubble -->
  <g transform="translate(150, 100)">
    <rect width="300" height="180" rx="20" fill="#FFFFFF" stroke="#138A5B" stroke-width="4"/>
    <polygon points="260,280 290,280 275,310" fill="#FFFFFF"/>
    
    <!-- Text lines -->
    <rect x="30" y="35" width="240" height="14" rx="7" fill="#E6F2FF"/>
    <rect x="30" y="65" width="200" height="14" rx="7" fill="#E6F2FF"/>
    <rect x="30" y="95" width="150" height="14" rx="7" fill="#E6F2FF"/>

    <!-- Magnifying Glass with Shield -->
    <g transform="translate(180, 70)">
      <circle cx="50" cy="50" r="45" fill="#138A5B" opacity="0.9"/>
      <circle cx="50" cy="50" r="30" fill="#FFFFFF"/>
      <path d="M 50 32 C 60 32 65 35 65 45 C 65 57 53 65 50 67 C 47 65 35 57 35 45 C 35 35 40 32 50 32 Z" fill="#138A5B"/>
      <line x1="72" y1="72" x2="105" y2="105" stroke="#0B5D42" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <text x="100" y="320" font-size="36">🔍</text>
  <text x="460" y="100" font-size="36">🛡️</text>
</svg>
