<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="Idoso Seguro+ Manaus — Aplicação web acessível e preventiva de segurança digital para pessoas idosas.">
    <meta name="theme-color" content="#1F5C45">
    <title>Idoso Seguro+ Manaus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/accessibility.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

    <div class="app-container">
        <header class="app-header" role="banner">
            <a href="#home" class="brand-logo" aria-label="Ir para o início">
                <svg class="brand-logo-img" aria-hidden="true"><use href="/assets/icons.svg#logo"></use></svg>
                <span class="brand-name">Idoso Seguro+</span>
            </a>
        </header>

        <main id="main-content" class="main-content" role="main" tabindex="-1">
            <div class="loader" aria-live="polite">
                <div class="spinner" aria-hidden="true"></div>
                <p class="loader-text">Carregando Idoso Seguro+ Manaus...</p>
            </div>
        </main>

        <nav class="bottom-nav" aria-label="Navegação principal">
            <a href="#home" class="nav-item" data-nav="home" id="nav-home">
                <svg class="nav-icon" aria-hidden="true"><use href="/assets/icons.svg#home"></use></svg>
                <span class="nav-label">Início</span>
            </a>
            <a href="#aprender" class="nav-item" data-nav="aprender" id="nav-aprender">
                <svg class="nav-icon" aria-hidden="true"><use href="/assets/icons.svg#school"></use></svg>
                <span class="nav-label">Aprender</span>
            </a>
            <a href="#assistir" class="nav-item" data-nav="assistir" id="nav-assistir">
                <svg class="nav-icon" aria-hidden="true"><use href="/assets/icons.svg#shield"></use></svg>
                <span class="nav-label">Assistir</span>
            </a>
            <a href="#acessibilidade" class="nav-item" data-nav="acessibilidade" id="nav-acessibilidade">
                <svg class="nav-icon" aria-hidden="true"><use href="/assets/icons.svg#settings"></use></svg>
                <span class="nav-label">Acessibilidade</span>
            </a>
            <a href="#ajuda" class="nav-item" data-nav="ajuda" id="nav-ajuda">
                <svg class="nav-icon" aria-hidden="true"><use href="/assets/icons.svg#help"></use></svg>
                <span class="nav-label">Ajuda</span>
            </a>
        </nav>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
